<!DOCTYPE html>
<html lang="en">

<head>
    <!-- ========== Meta Tags ========== -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="404 - Page Not Found | Stackly Platform">

    <!-- ========== Page Title ========== -->
    <title>404 - Page Not Found | Stackly Platform</title>

    <!-- ========== Favicon Icon ========== -->
    <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">

    <!-- ========== Google Fonts: Plus Jakarta Sans ========== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- ========== Start Stylesheet ========== -->
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/font-awesome.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- ========== End Stylesheet ========== -->

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #081321 0%, #0f2239 55%, #183354 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        @media (min-width: 576px) and (min-height: 520px) {
            body {
                height: 100vh;
                overflow: hidden;
            }
        }

        @media (max-width: 575.98px), (max-height: 519.98px) {
            body {
                min-height: 100vh;
                height: auto !important;
                overflow-y: auto !important;
                padding: 20px 12px !important;
                align-items: flex-start;
            }
        }

        .error-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            padding: 32px 30px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            margin: auto 0;
        }

        @media (max-width: 480px) {
            .error-card {
                padding: 22px 18px;
                border-radius: 10px;
            }
        }

        .auth-logo {
            max-height: 36px;
            margin-bottom: 12px;
        }

        .error-code {
            font-size: 76px;
            font-weight: 800;
            color: #0056b3;
            line-height: 1;
            margin: 12px 0 6px;
            letter-spacing: -1px;
        }

        .error-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f2239;
            margin-bottom: 6px;
        }

        .error-desc {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-action-primary {
            background-color: #0056b3;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action-primary:hover {
            background-color: #004494;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.35);
        }

        .btn-action-secondary {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-action-secondary:hover {
            background-color: #e2e8f0;
            color: #0f2239;
        }

        .session-badge {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 11px;
            color: #475569;
            display: inline-block;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

    <div class="error-card">

        <!-- Logo -->
        <a href="index.html" title="Stackly Home">
            <img src="images/logo-stackly.png" alt="Stackly Logo" class="auth-logo">
        </a>

        <!-- Big 404 Heading -->
        <div class="error-code">404</div>
        <div class="error-title">Page / Feature Not Found</div>
        <div class="error-desc" id="errorDescText">
            The page or module you are trying to access is currently unavailable or under development. You can safely return to the home page.
        </div>

        <!-- Active User Session Tag -->
        <div id="sessionContainer" style="display: none;">
            <div class="session-badge">
                <i class="fas fa-user-circle text-primary me-1"></i> Active Session: <strong id="userEmailText"></strong> (<span id="userRoleText" class="text-uppercase fw-bold text-primary"></span>)
            </div>
        </div>

        <!-- Return Actions -->
        <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
            <a href="index.html" class="btn-action-primary" id="returnHomeBtn">
                <i class="fas fa-home me-2"></i> Return to Home
            </a>
            <a href="dashboard.html" class="btn-action-primary" id="returnDashboardBtn" style="display: none;">
                <i class="fas fa-th-large me-2"></i> Return to Dashboard
            </a>
        </div>

        <div style="font-size: 11px; color: #94a3b8; border-top: 1px solid #f1f5f9; padding-top: 12px; margin-top: 12px;">
            &copy; 2026 Stackly Corporate Business. All rights reserved.
        </div>

    </div>

    <!-- Scripts -->
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const user = (typeof BuskeyAuth !== 'undefined') ? BuskeyAuth.getCurrentUser() : null;
            const dashboardBtn = document.getElementById('returnDashboardBtn');
            const homeBtn = document.getElementById('returnHomeBtn');
            const sessionContainer = document.getElementById('sessionContainer');
            const errorDesc = document.getElementById('errorDescText');

            if (user) {
                // Logged in: show Return to Dashboard + Return to Home (secondary)
                if (dashboardBtn) dashboardBtn.style.display = 'inline-flex';
                if (homeBtn) homeBtn.className = 'btn-action-secondary';
                if (sessionContainer) {
                    sessionContainer.style.display = 'block';
                    document.getElementById('userEmailText').textContent = user.email;
                    document.getElementById('userRoleText').textContent = user.role;
                }
                if (errorDesc) {
                    errorDesc.textContent = 'The page or module you are trying to access is currently unavailable or under development. You can safely return to the home page or go back to your dashboard.';
                }
            } else {
                // Not logged in: show ONLY Return to Home (primary)
                if (dashboardBtn) dashboardBtn.style.display = 'none';
                if (homeBtn) homeBtn.className = 'btn-action-primary';
                if (sessionContainer) sessionContainer.style.display = 'none';
                if (errorDesc) {
                    errorDesc.textContent = 'The page or module you are trying to access is currently unavailable or under development. You can safely return to the home page.';
                }
            }
        });
    </script>
</body>
</html>
